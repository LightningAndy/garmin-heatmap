name: Sync Brouter Routes

on:
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python convert_brouter.py

      - name: Commit updated heatmap
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/heatmap_*.json docs/manifest.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update brouter routes"
          git pull --rebase origin main
          git push
